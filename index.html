<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>SISTEMA AR-SAFETYMIN V1.0</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        .arjs-loader { height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-color: rgba(0, 0, 0, 0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .safety-ui { position: absolute; bottom: 20px; left: 20px; color: white; font-family: Arial; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-left: 4px solid #ff0000; }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader"><div>Cargando Redes Neuronales y Sensores...</div></div>
    
    <div class="safety-ui" id="ui-panel">
        <strong>STATUS: MONITOREO ACTIVO</strong><br>
        <span id="detection-info">Buscando operarios/maquinaria...</span>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-entity id="danger-alert" visible="false">
            <a-ring color="#ff0000" radius-inner="1.5" radius-outer="2" rotation="-90 0 0" position="0 0 -5"></a-ring>
            <a-text value="PELIGRO: HUMANO DETECTADO EN ZONA DE GIRO" color="red" align="center" position="0 2.5 -5" scale="1.5 1.5 1.5"></a-text>
        </a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let model;
        const alertEntity = document.querySelector('#danger-alert');
        const infoPanel = document.querySelector('#detection-info');

        // 1. Cargar el modelo de Visión Artificial
        async function initAI() {
            model = await cocoSsd.load();
            document.querySelector('.arjs-loader').style.display = 'none';
            console.log("Modelo IA Cargado satisfactoriamente");
            detectFrame();
        }

        // 2. Procesamiento de frames en tiempo real
        async function detectFrame() {
            const video = document.querySelector('video');
            if (video && video.readyState === 4) {
                const predictions = await model.detect(video);
                
                let humanDetected = false;
                
                predictions.forEach(prediction => {
                    // Filtrar por humanos u objetos críticos (truck, person, etc)
                    if (prediction.class === 'person' && prediction.score > 0.65) {
                        humanDetected = true;
                        infoPanel.innerText = `ALERTA: Persona detectada (${Math.round(prediction.score * 100)}%)`;
                    }
                });

                // 3. Feedback en Realidad Aumentada
                if (humanDetected) {
                    alertEntity.setAttribute('visible', 'true');
                    alertEntity.setAttribute('animation', 'property: scale; from: 0.8 0.8 0.8; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 500');
                } else {
                    alertEntity.setAttribute('visible', 'false');
                    infoPanel.innerText = "Área Segura - Escaneando...";
                }
            }
            requestAnimationFrame(detectFrame);
        }

        window.onload = initAI;
    </script>
</body>
</html>
